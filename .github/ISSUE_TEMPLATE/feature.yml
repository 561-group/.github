name: "Feature request"
description: "Suggest an improvement"
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "What would a good result look like?"
      description: "Describe the outcome; you do not need to propose an implementation."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Anything else?"
      description: "Alternatives considered, who benefits, links."
    validations:
      required: false
