name: "Bug report"
description: "Something is not working as expected"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, personal information or security vulnerabilities here."
  - type: textarea
    id: actual
    attributes:
      label: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Steps, a small example, or a link."
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "Version or environment"
      description: "Release, commit, URL, operating system."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Anything else?"
      description: "Logs, screenshots, who is affected."
    validations:
      required: false
