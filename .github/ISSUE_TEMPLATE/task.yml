name: "Maintainer task"
description: "Work the maintainers have agreed to do"
title: "[Task] "
body:
  - type: textarea
    id: change
    attributes:
      label: "What needs to change?"
      description: "Link the issue or decision this comes from, if there is one."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "How will we know it is done?"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: "Dependencies and risks"
    validations:
      required: false
